# Update pull requests from Dependabot (security alerts are separate and on in the repository settings).
# Same policy as quranweb: minor and patch updates are grouped into one pull request per ecosystem, a major update
# comes on its own. Nothing is ignored or closed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The node base image of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    commit-message:
      prefix: "docker"
