# Update pull requests from Dependabot (security alerts are separate and on in the repository settings).
# Same policy as quranweb: minor and patch updates are grouped into one pull request per ecosystem, a major update
# comes on its own. Nothing is ignored or closed.
# The npm and docker entries are added together with package.json and the Dockerfile; Dependabot reports an error
# for an ecosystem whose manifest does not exist yet.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
