name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege for the GITHUB_TOKEN: the jobs only read the code.
permissions:
  contents: read
  pull-requests: read

jobs:
  # A change that touches only documentation (Markdown, docs/, the licence) skips the jobs below, as in quranweb (PR #120).
  # A skipped job counts as passed for the required checks of the "Master" ruleset, so such a PR can still be merged.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # paths-filter needs the previous commit when this workflow runs on push.
          fetch-depth: 0

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'

  build:
    name: Lint & build (includes typecheck)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Next.js app does not exist yet. Until package.json is added, the job
      # passes with a notice instead of failing, so the workflow can be in place
      # (and required by the ruleset later) from the first commit.
      - name: No app yet
        if: hashFiles('package.json') == ''
        run: echo "::notice::No package.json yet, nothing to lint, test or build."

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test

      # No separate `tsc --noEmit`: Next.js generates some types during the build,
      # and `next build` runs the full type check itself (same as quranweb).
      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build

  docker:
    # The image the servers build: it must start and serve its files as the runtime user (uid 1001), with the checkout's
    # permissions as strict as on the server (quranweb PR #71).
    name: Docker image starts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and smoke test
        run: bash scripts/docker-smoke.sh
        env:
          STRICT_PERMISSIONS: "1"

  e2e:
    # Browser tests (e2e/*.e2e.ts) against the production build, as in quranweb. The books come from the small data copy
    # in e2e/fixtures, HadeethEnc from a fake server over its fixtures, so no network is needed.
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
